name: token-bot

# SWITCHED OFF by the owner (2026-11-14): EVO_OFF below is "true" and the 5-minute schedule is removed.
# The bot closes its open paper trades, then stops restarting itself. To switch it back on: set EVO_OFF to
# "false", put the schedule back (cron "*/5 * * * *") and start one run by hand.
on:
  workflow_dispatch:

# one run at a time; each run starts the next one when it finishes (last step), so the bot is offline only
# for the ~1 minute of job setup between runs. Cancel a run (or disable the workflow) to stop the chain.
concurrency:
  group: token-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # lets the last step start the next run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest commit, not the one from when this run was queued (stale state)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot cycle (about 25 minutes)
        run: python run_once.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          OWNER_CHAT_ID: "8643619357"
          DRY_RUN: "true"
          EVO_MODE: "true"
          EVO_OFF: "true"
          EVO_POP: "300"
          EVO_START_USD: "10"
          LOOP_SECONDS: "1500"
          SCALP_TARGET_USD: "0.20"
          # with take-profits of 45%+ and stop-losses under 8%, about 1 win in 3 is profitable; a high target only
          # rewards luck. Every check also requires net profit.
          EVO_TARGET_WINRATE: "0.35"
          # Hermes agent ideas (hermes_ideas.py). Empty = off. The ideas repo is the only thing Hermes can write to.
          HERMES_IDEAS_REPO: ${{ vars.HERMES_IDEAS_REPO }}
          HERMES_MAX_USD: "1.0"
          GITHUB_TOKEN: ${{ github.token }}

      - name: Save state
        if: always()
        run: |
          git config user.name "token-bot"
          git config user.email "token-bot@users.noreply.github.com"
          git add -u
          if [ -f evo_state.json ]; then git add evo_state.json; fi
          if [ -f hermes_results.json ]; then git add hermes_results.json; fi   # what Hermes reads to learn
          if [ -d paths ]; then git add -A paths; fi   # recorded price paths (new files; old ones pruned)
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)

      - name: Start the next run
        if: success()
        # switched off: only while paper trades are still open
        run: |
          OPEN=$(EVO_OFF=true TELEGRAM_BOT_TOKEN=x python -c "import evo; print(evo.open_trades(evo.load()))")
          echo "open trades: $OPEN"
          if [ "$OPEN" != "0" ]; then gh workflow run token-bot.yml --ref "${{ github.ref_name }}"; fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
