name: token-bot

on:
  schedule:
    - cron: "*/5 * * * *"   # backup only: GitHub often delays or skips these by an hour or more
  workflow_dispatch:

# one run at a time; each run starts the next one when it finishes (last step), so the bot is offline only
# for the ~1 minute of job setup between runs. Cancel a run (or disable the workflow) to stop the chain.
concurrency:
  group: token-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # lets the last step start the next run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest commit, not the one from when this run was queued (stale state)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot cycle (about 25 minutes)
        run: python run_once.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          OWNER_CHAT_ID: "8643619357"
          DRY_RUN: "true"
          EVO_MODE: "true"
          EVO_POP: "300"
          EVO_START_USD: "10"
          LOOP_SECONDS: "1500"
          SCALP_TARGET_USD: "0.20"
          # with take-profits of 45%+ and stop-losses under 8%, about 1 win in 3 is profitable; a high target only
          # rewards luck. Every check also requires net profit.
          EVO_TARGET_WINRATE: "0.35"

      - name: Save state
        if: always()
        run: |
          git config user.name "token-bot"
          git config user.email "token-bot@users.noreply.github.com"
          git add -u
          if [ -f evo_state.json ]; then git add evo_state.json; fi
          if [ -d paths ]; then git add -A paths; fi   # recorded price paths (new files; old ones pruned)
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)

      - name: Start the next run
        if: success()
        run: gh workflow run token-bot.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
