name: token-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# one run at a time; the next scheduled run waits and starts as soon as this one ends,
# so monitoring is close to continuous (short holds need it)
concurrency:
  group: token-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot cycle (about 5 minutes)
        run: python run_once.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          OWNER_CHAT_ID: "8643619357"
          DRY_RUN: "true"
          EVO_MODE: "true"
          EVO_POP: "6"
          EVO_START_USD: "10"
          LOOP_SECONDS: "290"
          SCALP_TARGET_USD: "0.20"
          # lower this (for example "0.5") to let big-target variants survive on profit instead of win rate
          EVO_TARGET_WINRATE: "0.9"

      - name: Save state
        if: always()
        run: |
          git config user.name "token-bot"
          git config user.email "token-bot@users.noreply.github.com"
          git add -u
          if [ -f evo_state.json ]; then git add evo_state.json; fi
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
